[package]
name = "conduit-rs"
version = "0.1.0"
edition = "2024"

# Not part of the server's workspace.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
