<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <style>
    :root {
      --bg: #ffffff; --panel: #f6f7f9; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb;
      --accent: #4f46e5; --bar-bg: #e9ebef; --danger: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --panel: #1c1f24; --text: #e8eaed; --muted: #9aa0a6; --line: #2c2f33;
        --accent: #8b85ff; --bar-bg: #2a2e34; --danger: #ff7b6b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0; }
    a { color: inherit; }
    .sub { color: var(--muted); margin: 4px 0 16px; font-size: .9rem; }
    .ranges { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .ranges button { font: inherit; font-size: .85rem; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
    .ranges button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .card { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .head h2 { font-size: 1.1rem; margin: 0; }
    .apps { color: var(--muted); font-size: .82rem; }
    .share { height: 6px; border-radius: 3px; background: var(--bar-bg); margin: 10px 0 12px; overflow: hidden; }
    .share i { display: block; height: 100%; background: var(--accent); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 16px; }
    .tiles div b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .tiles div span { color: var(--muted); font-size: .78rem; }
    .bad { color: var(--danger); }
    .muted { color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Projects</h1>
    <p class="sub">What each project uses, the busiest first. The bar is its share of the server's CPU time. Updates every 5 seconds. <a href="/_platform/requests">Requests and response times</a></p>
    <div class="ranges" id="ranges"></div>
    <div id="projects"><p class="muted">Loading…</p></div>
  </main>
  <script>
    const RANGES = ["1h", "24h", "7d", "30d"];
    let range = "24h";
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const num = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n));
    const bytes = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : n >= 1e3 ? (n / 1e3).toFixed(0) + " KB" : n + " B";
    const secs = (s) => s >= 3600 ? (s / 3600).toFixed(1) + " h" : s >= 60 ? (s / 60).toFixed(1) + " min" : s >= 1 ? s.toFixed(1) + " s" : (s * 1000).toFixed(0) + " ms";

    function renderRanges() {
      document.getElementById("ranges").innerHTML = RANGES.map((r) => `<button aria-pressed="${r === range}" data-r="${r}">${r}</button>`).join("");
      for (const b of document.querySelectorAll("#ranges button")) b.onclick = () => { range = b.dataset.r; renderRanges(); load(); };
    }

    function tile(value, label, cls = "") {
      return `<div><b class="${cls}">${value}</b><span>${label}</span></div>`;
    }

    function render(data) {
      const total = data.projects.reduce((s, p) => s + p.cpu_seconds, 0);
      document.getElementById("projects").innerHTML = data.projects.length ? data.projects.map((p) => {
        const share = total > 0 ? (p.cpu_seconds / total) * 100 : 0;
        const app = p.apps[0] || p.name;
        const tiles = [
          tile(num(p.requests), "requests"),
          tile(num(p.errors), "failed (5xx, timeouts)", p.errors > 0 ? "bad" : ""),
          tile(secs(p.cpu_seconds), "CPU time"),
          tile(secs(p.db_seconds), `database, ${num(p.db_queries)} queries`),
          tile(num(p.outbound_requests), "outgoing requests"),
          tile(bytes(p.egress_bytes), "traffic out"),
          tile(bytes(p.database_bytes), "databases on disk"),
          tile(bytes(p.file_bytes), "files on disk"),
        ];
        if (p.static_requests) tiles.push(tile(num(p.static_requests), "static files served"));
        if (p.events) tiles.push(tile(num(p.events), "queue and cron events"));
        if (p.cache_bytes) tiles.push(tile(bytes(p.cache_bytes), "in cache"));
        if (p.websockets || p.ws_messages) tiles.push(tile(`${num(p.websockets)} open`, `WebSockets, ${num(p.ws_messages)} messages`));
        return `<section class="card">
          <div class="head"><h2>${esc(p.name)}</h2><span class="apps">${p.apps.length > 1 ? esc(p.apps.join(", ")) + " · " : ""}<a href="/_platform/requests?app=${encodeURIComponent(app)}">charts</a></span></div>
          <div class="share" title="${share.toFixed(0)}% of the CPU time"><i style="width:${share}%"></i></div>
          <div class="tiles">${tiles.join("")}</div>
        </section>`;
      }).join("") : `<p class="muted">No projects yet.</p>`;
    }

    async function load() {
      try {
        render(await (await fetch(`/_platform/usage?range=${range}`)).json());
      } catch {
        // Keep showing the last data if a refresh fails.
      }
    }
    renderRanges();
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
