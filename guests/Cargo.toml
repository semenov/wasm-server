# Guest apps live in their own workspace because they build for
# wasm32-wasip2, not for the host.
[workspace]
resolver = "3"
members = ["hello", "compute", "catalog", "conduit", "stats", "shortener", "chat"]

[workspace.dependencies]
wasip2 = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
