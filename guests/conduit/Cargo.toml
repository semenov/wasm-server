[package]
name = "conduit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2.workspace = true
wit-bindgen = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
