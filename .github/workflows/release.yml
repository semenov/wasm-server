# A release: push a tag (git tag v0.1.0 && git push origin v0.1.0). Builds
# the server for Linux (servers: install.sh downloads it) and macOS (`plumb
# dev` downloads it), on x86_64 and aarch64, and publishes the binaries
# (gzipped), their checksums and install.sh.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, os: linux, arch: aarch64, target: aarch64-unknown-linux-gnu }
          - { runner: macos-14, os: macos, arch: aarch64, target: aarch64-apple-darwin }
          - { runner: macos-14, os: macos, arch: x86_64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p wasm-server --target ${{ matrix.target }}
      - run: |
          B=target/${{ matrix.target }}/release/wasm-server
          strip $B
          if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then $B --help > /dev/null; fi
          gzip -9 -c $B > wasm-server-${{ matrix.os }}-${{ matrix.arch }}.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: wasm-server-${{ matrix.os }}-${{ matrix.arch }}.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum wasm-server-*.gz > SHA256SUMS
      - run: |
          gh release create "$GITHUB_REF_NAME" wasm-server-*.gz SHA256SUMS install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes "Install on a Linux server: \`plumb server add root@HOST\`, or by hand: \`curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh -s -- --domain example.com\`"
        env:
          GH_TOKEN: ${{ github.token }}
